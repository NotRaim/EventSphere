<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050809"><title>Join EventSphere</title><link rel="stylesheet" href="css/style.css"></head><body>

<header class="site-nav">
  <a class="brand" href="index.html"><img class="brand-logo" src="assets/eventsphere-logo.svg" alt="EventSphere"><span class="brand-name">EventSphere</span></a>
  <nav class="nav-links">
    <a class="" href="index.html">Home</a>
    <a class="" href="events.html">Discover</a>
    <a class="" href="organizer.html">Create event</a>
    <a class="" href="dashboard.html">My plans</a>
  </nav>
  <div class="nav-actions">
    <button class="nav-toggle" data-menu aria-label="Open menu">☰</button>
  </div>
</header>
<div class="mobile-panel">
  <a href="index.html">Home</a>
  <a href="events.html">Discover events</a>
  <a href="organizer.html">Create event</a>
</div>
<main class="auth-page"><div class="container"><div class="auth-shell glass-panel reveal">
      <aside class="auth-art"><div class="eyebrow"><i></i>Come along</div><h1>Make room for better plans.</h1><p>Create a profile, save events and build a calendar of things worth doing.</p></aside>
      <section class="auth-form"><div class="section-kicker">Join EventSphere</div><h2>Create account</h2><p class="muted">Start discovering better plans.</p>
      <form id="auth-form" data-mode="register">
      <div class="form-row"><div class="field"><label>Name</label><input name="name" required placeholder="Your name"></div><div class="field"><label>Phone</label><input name="phone" placeholder="Optional"></div></div>
      <div class="field"><label>Email</label><input type="email" name="email" required placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input type="password" name="password" required minlength="8" placeholder="At least 8 characters"></div>
      <div class="field"><label>Joining as</label><select name="role"><option value="user">Attendee</option><option value="organizer">Organizer</option></select></div>
    <button type="submit" class="btn btn-cyan" style="width:100%">Create my account →</button><div class="message"></div></form>
      <p class="muted" style="font-size:13px">Already have an account? <a style="color:var(--cyan)" href="login.html">Log in</a></p></section>
    </div></div></main>
<div id="toasts"></div>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<button class="back-button" type="button" data-back>← Back</button></body></html>
