<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050809"><title>QR Check-in — EventSphere</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-nav"><a class="brand" href="index.html"><span class="brand-mark">E</span><span>EventSphere</span></a><nav class="nav-links"><a href="index.html">Home</a><a href="events.html">Discover</a><a class="active" href="organizer.html">Organizer</a><a href="manage-events.html">Manage events</a><a href="attendees.html">Attendees</a><a href="checkin.html">QR check-in</a></nav><div class="nav-actions"><button class="nav-toggle" data-menu>☰</button></div></header>
<div class="mobile-panel"><a href="index.html">Home</a><a href="events.html">Discover events</a><a href="organizer.html">Create event</a><a href="manage-events.html">Manage events</a><a href="attendees.html">Attendees</a><a href="checkin.html">QR check-in</a><a href="analytics.html">Analytics</a></div>
<main class="dashboard-page"><div class="container"><div class="dash-top reveal"><div><div class="section-kicker">Door check-in</div><h1 class="section-title">Scan every<br><span style="color:var(--cyan)">ticket.</span></h1><p class="section-copy">Use the camera to scan a ticket QR code, or enter the ticket code manually.</p></div></div>
<section class="glass-panel panel reveal" style="max-width:720px;margin:auto">
<div id="scanner-wrap" hidden><video id="qr-video" playsinline muted style="width:100%;max-height:420px;object-fit:cover;border-radius:20px;background:#050809;border:1px solid var(--line)"></video><div class="toolbar" style="margin-top:12px"><button class="btn btn-cyan" id="stop-scanner" type="button">Stop scanner</button><span class="muted" id="scanner-status">Point the camera at the ticket QR.</span></div></div>
<div class="toolbar" style="margin-bottom:18px"><button class="btn btn-cyan" id="start-scanner" type="button">📷 Scan with camera</button></div>
<div class="field"><label>Ticket code</label><input id="ticket-code" placeholder="ES-XXXXXXXXXXXXXXX" autocomplete="off"></div><button class="btn btn-ghost" id="verify-ticket" type="button">Verify & check in</button><div id="checkin-result" class="muted" style="margin-top:18px"></div>
</section></div></main><div id="toasts"></div><script src="js/app.js"></script><script src="js/checkin.js"></script><button class="back-button" type="button" data-back>← Back</button></body></html>
