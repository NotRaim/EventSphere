<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Check-in — EventSphere</title><link rel="stylesheet" href="css/style.css"></head><body>
<header class="site-nav"><a class="brand" href="index.html"><span class="brand-mark">E</span><span>EventSphere</span></a><nav class="nav-links"><a href="index.html">Home</a><a href="events.html">Discover</a><a class="active" href="organizer.html">Organizer</a><a href="dashboard.html">My plans</a></nav><div class="nav-actions"><button class="nav-toggle" data-menu>☰</button></div></header><div class="mobile-panel"><a href="index.html">Home</a><a href="events.html">Discover</a><a href="organizer.html">Organizer</a><a href="dashboard.html">My plans</a><a href="tickets.html">My tickets</a><a href="profile.html">Profile</a></div>
<main class="dashboard-page"><div class="container"><div class="dash-top reveal"><div><div class="section-kicker">Door check-in</div><h1 class="section-title">Verify every<br><span style="color:var(--cyan)">ticket.</span></h1><p class="section-copy">A ticket is accepted only when its signed code exists in MongoDB and is still valid.</p></div></div><section class="glass-panel panel checkin-box reveal"><div class="field"><label>Ticket code</label><input id="ticket-code" placeholder="ES-XXXXXXXXXXXXXXX"></div><button class="btn btn-cyan" id="verify-ticket">Verify & check in</button><div id="checkin-result" class="muted" style="margin-top:18px"></div></section></div></main><div id="toasts"></div><script src="js/app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const u=ES.guard('organizer');if(!u)return;document.querySelector('#verify-ticket').onclick=async()=>{const code=document.querySelector('#ticket-code').value.trim();const out=document.querySelector('#checkin-result');if(!code){out.textContent='Enter a ticket code.';return}try{const r=await ES.api('/tickets/verify/'+encodeURIComponent(code),{auth:false});if(!r.valid){out.textContent='Invalid, cancelled, or already used ticket.';ES.toast('Ticket is not valid','error');return}const list=await ES.api('/tickets/organizer');const found=list.find(t=>t.ticketCode===code);if(!found){out.textContent='This ticket is valid, but it is not assigned to an event you manage.';return}await ES.api('/tickets/'+found.id+'/checkin',{method:'POST'});out.innerHTML='<strong>✓ CHECKED IN</strong><br>'+ES.esc(r.ticket.event.title)+'<br>'+ES.esc(r.ticket.ticketCode);ES.toast('Ticket checked in ✓','success')}catch(err){out.textContent=err.message;ES.toast(err.message,'error')}}})</script><button class="back-button" type="button" data-back>← Back</button></body></html>
