<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050809"><title>Discover events — EventSphere</title><link rel="stylesheet" href="css/style.css"></head><body>

<header class="site-nav">
  <a class="brand" href="index.html"><span class="brand-mark">E</span><span>EventSphere</span></a>
  <nav class="nav-links">

  <a href="index.html">Home</a>

<main class="dashboard-page"><div class="container">
  <div class="reveal"><div class="section-kicker">Discover</div><h1 class="section-title">Find something<br><span style="color:var(--cyan)">worth going to.</span></h1><p class="section-copy">Search by event, venue or category. Save what you like and open any card for the full experience.</p></div>
  <div class="search-row reveal" style="margin-top:26px"><input id="event-search" class="search" placeholder="Search events, venues or cities…"><select id="sort" class="search" style="max-width:190px"><option value="date">Soonest</option><option value="popular">Popular</option><option value="price">Lowest price</option></select></div>
  <div class="toolbar reveal"><button class="btn btn-ghost" id="advanced-toggle">Advanced filters</button><span class="muted" id="result-count"></span></div><p id="expired-note" class="muted" style="min-height:18px;margin:8px 0 0"></p><div class="glass-panel filter-drawer" id="advanced-filters"><div class="filter-grid"><div class="field"><label>City</label><input class="search" id="city-filter" placeholder="Ahmedabad"></div><div class="field"><label>Maximum price</label><input class="search" id="price-filter" type="number" min="0" placeholder="Any"></div><div class="field"><label>Date from</label><input class="search" id="date-filter" type="date"></div><div class="field"><label>Availability</label><select class="search" id="availability-filter"><option value="all">All</option><option value="available">Available only</option><option value="free">Free events</option></select></div></div></div><div class="filters reveal"><button class="filter active" data-cat="All">All</button><button class="filter" data-cat="Music">Music</button><button class="filter" data-cat="Food">Food</button><button class="filter" data-cat="Design">Design</button><button class="filter" data-cat="Film">Film</button><button class="filter" data-cat="Sports">Sports</button><button class="filter" data-cat="Wellness">Wellness</button><button class="filter" data-cat="Community">Community</button></div>
  <div class="event-grid" id="events-grid"></div>
</div></main>
<footer class="footer"><div class="container footer-grid"><strong>EventSphere</strong><div class="footer-links"><a href="index.html">Home</a><a href="dashboard.html">My plans</a><a href="tickets.html">My tickets</a><a href="saved.html">Saved plans</a><a href="profile.html">Profile</a></div></div></footer>

<div id="toasts"></div>
<script src="js/app.js"></script>
<script src="js/event-card.js"></script><script src="js/events.js"></script>
